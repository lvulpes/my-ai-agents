# Coding job on an external repo (WORKSPACE_DIR in .env).
# Architect mode: a strong model plans, a cheap fast one writes the edits.
# Both come from .env via compose.aider.yaml:
#   MODEL_AIDER (or --model)  -> AIDER_MODEL         the planner
#   EDITOR_MODEL_AIDER        -> AIDER_EDITOR_MODEL  the editor (also the weak model for commit msgs/summaries)
# Any provider works: gemini/..., groq/..., or openrouter/<vendor>/<model> with one OPENROUTER_API_KEY.
architect: true

# Job instructions (git rules, tools), shared with Claude Code
read:
  - /config/CLAUDE.md
  - /work/AGENTS.md

# You review and commit yourself; don't touch the target repo's .gitignore
auto-commits: false
gitignore: false

# Keep aider's own files in state/, not in the target repo
input-history-file: /home/agent/.aider.input.history
chat-history-file: /home/agent/.aider.chat.history.md

analytics: false
check-update: false
