# Shared by every tool. The tool-specific parts (image, entrypoint, state, model)
# are in compose.<tool>.yaml; run.sh adds the one picked by TOOL= or --tool.
name: recipe

services:
  recipe:
    user: "1000:1000"
    working_dir: /work
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./workspace:/work:z
