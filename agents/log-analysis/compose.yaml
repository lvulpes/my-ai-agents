# Shared by every tool. The tool-specific parts (image/build, entrypoint, state,
# model) are in compose.<tool>.yaml; run.sh adds the one picked by TOOL= or --tool.
name: log-analysis

services:
  log-analysis:
    user: "1000:1000"
    working_dir: /work
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
      # No :z relabel, so evidence file metadata is never modified
      - label:disable
    cap_drop:
      - ALL
    volumes:
      # Both folders come from .env (any folder on the host), else the job's own
      # ./evidence and ./cases. A wrong path fails instead of creating an empty folder.
      # The logs: always read-only
      - type: bind
        source: ${LOGS_DIR:-./evidence}
        target: /work/evidence
        read_only: true
        bind:
          create_host_path: false
      # The reports and the agent's working files (notes, scripts, extracts)
      - type: bind
        source: ${REPORTS_DIR:-./cases}
        target: /work/cases
        bind:
          create_host_path: false
