# Shared by every tool. The tool-specific parts (image/build, entrypoint, state,
# model) are in compose.<tool>.yaml; run.sh adds the one picked by TOOL= or --tool.
name: network-forensics

services:
  network-forensics:
    user: "1000:1000"
    working_dir: /work/cases
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
      # No :z relabel, so evidence file metadata is never modified
      - label:disable
    cap_drop:
      - ALL
    volumes:
      - ./cases:/work/cases
      - ./evidence:/work/evidence:ro
