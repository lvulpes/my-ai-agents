# Shared by every tool. The tool-specific parts (image/build, entrypoint, state,
# model) are in compose.<tool>.yaml; run.sh adds the one picked by TOOL= or --tool.
name: literature-review

services:
  literature-review:
    user: "1000:1000"
    # /work itself is not persisted: only papers/ and workspace/ come from the host
    working_dir: /work
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
      # No :z relabel, so the papers folder (any folder on the host) is never modified
      - label:disable
    cap_drop:
      - ALL
    volumes:
      # The papers are never modified; anything the agent makes goes to workspace/.
      # PAPERS_DIR from .env (any folder on the host), else the job's own ./papers.
      # A wrong path fails instead of creating an empty folder.
      - type: bind
        source: ${PAPERS_DIR:-./papers}
        target: /work/papers
        read_only: true
        bind:
          create_host_path: false
      - ./workspace:/work/workspace:z
